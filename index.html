(() => {
'use strict';
const INTERVALS = [1, 3, 7, 14, 30];
function dateKey(date = new Date()) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
function addDays(key, n) { const [y,m,d] = key.split('-').map(Number); return dateKey(new Date(y,m-1,d+n,12)); }
function isDue(w, day) { return !w.started || w.pending.some(d=>d<=day); }
function mastered(w) { return !!w.started && w.pending.length===0; }
function answerWord(w, correct, day, mode='study') {
 const next = {...w, pending:[...w.pending], correct:w.correct+(correct?1:0), wrong:w.wrong+(correct?0:1)};
 if(mode==='random') return next;
 if(correct && !w.started) { next.started=day; next.pending=INTERVALS.map(n=>addDays(day,n)); }
 else { next.pending=next.pending.filter(d=>d>day); if(!correct) { next.started ||= null; next.pending.push(addDays(day,1)); } }
 // New words with a failed attempt are due tomorrow, rather than immediately again.
 if(!correct && !w.started) next.started='retry';
 if(correct && w.started==='retry') { next.started=day; next.pending=INTERVALS.map(n=>addDays(day,n)); }
 next.pending=[...new Set(next.pending)].sort(); return next;
}
function weightedPick(words, previousId, rng=Math.random) {
 const pool=words.length>1?words.filter(w=>w.id!==previousId):words;
 if(!pool.length) return null;
 const weights=pool.map(w=>mastered(w)?0.15:1+4*(w.wrong+1)/(w.correct+w.wrong+2));
 let r=rng()*weights.reduce((a,b)=>a+b,0);
 return pool.find((w,i)=>(r-=weights[i])<0)||pool.at(-1);
}
function normalize(s) { return s.normalize('NFKC').trim().toLowerCase().replace(/\s+/g,' '); }
function checkAnswer(word, input) { return word.meaning.split('|').some(a=>normalize(a)===normalize(input)); }
function parseCSV(text) {
 text=text.replace(/^\uFEFF/,''); const rows=[]; let row=[], cell='', quoted=false, ended=false;
 for(let i=0;i<text.length;i++) {const c=text[i];
  if(quoted) { if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"'){quoted=false;ended=true;}else cell+=c; }
  else if(c==='"'){if(cell||ended)throw Error('引用符の位置が正しくありません。');quoted=true;}
  else if(c===','||c==='\n'||c==='\r'){row.push(cell);cell='';ended=false;if(c!==','){if(c==='\r'&&text[i+1]==='\n')i++;if(row.some(v=>v.trim()))rows.push(row);row=[];}}
  else {if(ended&&!/\s/.test(c))throw Error('閉じ引用符の後に不正な文字があります。');if(!ended)cell+=c;}
 }
 if(quoted)throw Error('CSVの引用符が閉じていません。');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);
 if(rows.length<2)throw Error('ヘッダーと単語データが必要です。');
 const header=rows.shift().map(v=>v.trim().toLowerCase());const wi=header.indexOf('word'),mi=header.indexOf('meaning'),ei=header.indexOf('example');
 if(wi<0||mi<0)throw Error('word と meaning のヘッダーが必要です。');
 if(rows.length>10000)throw Error('一度に取り込めるのは10,000語までです。');
 return rows.map((r,i)=>{const word=r[wi]?.trim(),meaning=r[mi]?.trim(),example=ei<0?'':(r[ei]||'').trim();if(!word||!meaning||!meaning.split('|').every(a=>a.trim()))throw Error(`${i+2}行目のwordまたはmeaningが空です。`);if(word.length>200||meaning.length>2000||example.length>4000)throw Error(`${i+2}行目の文字数が長すぎます。`);return {word,meaning,example};});
}
function validateBackup(data) {
 const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&addDays(d,0)===d;
 if(data?.version!==1||!Array.isArray(data.words)||data.words.length>50000||!Array.isArray(data.history))throw Error('バックアップの形式が正しくありません。');
 const ids=new Set();for(const w of data.words){if(typeof w.id!=='string'||ids.has(w.id)||typeof w.word!=='string'||!w.word.trim()||typeof w.meaning!=='string'||!w.meaning.trim()||typeof w.example!=='string'||![w.correct,w.wrong].every(n=>Number.isSafeInteger(n)&&n>=0)||!Array.isArray(w.pending)||!w.pending.every(validDate)||!(w.started===null||w.started==='retry'||validDate(w.started)))throw Error('単語データが不正です。');ids.add(w.id);}
 if(!data.history.every(h=>validDate(h.day)&&typeof h.correct==='boolean'&&typeof h.wordId==='string'&&['study','random'].includes(h.mode)))throw Error('履歴データが不正です。');return data;
}

globalThis.KotonohaCore = { INTERVALS, dateKey, addDays, isDue, mastered, answerWord, weightedPick, normalize, checkAnswer, parseCSV, validateBackup };
})();


</script><script data-source="app.js">
(() => {
'use strict';
const {dateKey,addDays,isDue,mastered,answerWord,weightedPick,parseCSV,validateBackup,normalize} = globalThis.KotonohaCore;

let state={version:1,words:[],history:[]},page='home',month=dateKey().slice(0,7),selectedDay=dateKey(),session=null,preview=[],query='',storageError=false;
try {const raw=localStorage.getItem(KEY);if(raw)state=validateBackup(JSON.parse(raw));}catch{storageError=true;}

function heading(kicker,title,description,action=''){return `<section class="page-heading"><div><span class="eyebrow">${kicker}</span><h1>${title}</h1><p>${description}</p></div>${action}</section>`;}

<section class="stats"><article><span class="stat-icon sage">◒</span><div><p>今日の復習</p><strong>${today}<small>語</small></strong><span>未学習・期限超過を含む</span></div></article><article><span class="stat-icon peach">☼</span><div><p>明日の復習予定</p><strong>${tomorrow}<small>語</small></strong><span>登録済みの復習予定</span></div></article><article><span class="stat-icon lilac">❧</span><div><p>定着した単語</p><strong>${learned}<small>語</small></strong><span>全 ${state.words.length} 語中</span></div></article></section>
<section class="bottom-grid"><article class="panel"><div class="panel-title"><h2>これからの7日間</h2><button class="text-button" data-page="calendar">カレンダーを見る ↗</button></div><div class="week-chart">${Array.from({length:7},(_,i)=>{const d=addDays(dateKey(),i),n=i===0?today:planned(d).length,max=Math.max(1,today,...Array.from({length:6},(_,j)=>planned(addDays(dateKey(),j+1)).length));return `<button data-day="${d}" class="chart-col"><span>${n}</span><div class="bar-track"><i style="height:${Math.max(4,n/max*100)}%" class="${i===0?'current':''}"></i></div><small>${i===0?'今日':new Date(d+'T12:00:00').toLocaleDateString('ja-JP',{weekday:'short'})}</small></button>`;}).join('')}</div><p class="muted">予定は学習の結果に合わせて更新されます。</p></article><article class="random-panel"><span class="eyebrow">練習</span><span class="random-symbol">⤨</span><h2>ランダム練習</h2><p>苦手な単語を優先して出題します。復習予定は変更しません。</p><button class="secondary" data-page="random">ランダム学習へ ↗</button></article></section><div class="daily-note">今日の回答数：${done} 回</div>`;}
function calendar(){const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();return heading('YOUR LEARNING RHYTHM','復習カレンダー','明日の予定も、その先の積み重ねも。')+`<section class="panel"><div class="panel-title"><h2>${y}年 ${m}月</h2><div class="calendar-controls"><button id="prev-month" aria-label="前月">←</button><button id="this-month">今月</button><button id="next-month" aria-label="翌月">→</button></div></div><div class="calendar">${['日','月','火','水','木','金','土'].map(s=>`<span class="weekday">${s}</span>`).join('')}${'<span></span>'.repeat(first)}${Array.from({length:days},(_,i)=>{const d=`${month}-${String(i+1).padStart(2,'0')}`,n=d===dateKey()?due().length:planned(d).length;return `<button data-day="${d}" class="day ${d===dateKey()?'today':''} ${d===selectedDay?'selected':''}"><span>${i+1}</span><small>${n?n+' 語':'—'}</small></button>`;}).join('')}</div><p class="muted">今日には未学習・期限超過も含みます。未来の日付は確定済みの復習予定です。同日の予定は1語につき1回にまとめます。</p></section><section class="panel day-detail"><h2>${selectedDay} の復習</h2>${wordTable(selectedDay===dateKey()?due():planned(selectedDay))}</section>`;}
function study(){if(!session)startSession(page==='random'?'random':'study');const w=state.words.find(w=>w.id===session.current);if(!w)return heading('ONE STEP FORWARD',state.words.length?'復習が完了しました':'単語が登録されていません',state.words.length?'いま出題できる復習を終えました。次の予定はカレンダーで確認できます。':'CSVをインポートして学習を始めてください。')+`<section class="completion panel"><span>❧</span><h2>${session.count} 語を学習しました</h2><p>ランダム学習では、いつでも練習できます。</p>${importButton()} <button class="primary" data-page="home">ホームへ戻る</button></section>`;return heading(session.mode==='random'?'':'',session.mode==='random'?'ランダム練習':'今日の復習',session.mode==='random'?'苦手な単語ほど出やすく、定着済みの単語も低い確率で出題します。':'最初の正答から1・3・7・14・30日後。残りの予定は保持されます。')+`<section class="study-card"><div class="study-top"><span class="pill">${session.mode==='random'?'ランダム学習':'今日の復習'}</span><div class="study-progress"><span><b>${session.count}</b> 語完了</span>${session.mode==='study'?'<span>残り <b>'+(session.queue.length+1)+'</b> 語</span>':''}</div></div><span class="eyebrow">この単語の意味は？</span><h2 class="study-word">${esc(w.word)}</h2>${!session.revealed?`<p class="recall-hint">意味を思い浮かべてから、答えを確認しましょう。</p><button id="reveal" class="primary reveal-button">答えを見る</button>`:`<div class="answer-reveal"><span class="eyebrow">MEANING</span><h3>${esc(w.meaning.replaceAll('|',' / '))}</h3>${w.example?`<p>${esc(w.example)}</p>`:''}</div><div class="answer-buttons"><button class="secondary incorrect" data-result="wrong"><span class="judgment-mark" aria-hidden="true">×</span><span>覚えていなかった</span><small>${session.mode==='random'?'誤答として記録':'翌日に再出題'}</small></button><button class="primary" data-result="correct"><span class="judgment-mark" aria-hidden="true">○</span><span>覚えていた</span><small>正答として記録</small></button></div>`}<div class="study-foot">${session.mode==='random'?'✧ 正誤の記録のみ更新します。復習予定は変わりません。':'✧ 誤答しても、先の復習予定はなくなりません。'}</div></section>`;}
function startSession(mode){const queue=mode==='study'?due().map(w=>w.id):[];session={mode,queue,current:mode==='study'?queue.shift():weightedPick(state.words)?.id,count:0,revealed:false};}
function settings(){return heading('MAKE IT YOURS','データと設定','学習記録は、このブラウザーの中に。')+`<section class="panel settings"><h2>学習データのバックアップ</h2><p>ブラウザーのデータを削除すると、単語と学習記録も消えます。定期的にJSONファイルを保存してください。別の端末への移行にも使えます。</p><button id="export-backup" class="primary">↓ バックアップを保存</button><label class="secondary file-label">バックアップを復元<input type="file" id="restore-backup" accept=".json,application/json"></label><h2>復習のしくみ</h2><p>初回の正答日を基準に、1・3・7・14・30日後の予定を作成します。予定日に正答しても、それより後の予定はすべて残ります。誤答すると翌日の予定が追加されます。期限を過ぎた予定は、今日の1回の復習にまとめます。最後の予定を正答すると定着済みになります。</p><p>ランダム学習は正誤回数のみ更新します。復習予定や定着の状態は変更しません。新規単語の初回誤答も翌日に再出題します。</p><h2>保存先について</h2><p>アカウント登録や通信は不要です。保存先は端末・ブラウザー・URLごとに独立しています。ローカルとGitHub Pagesの間でデータを移す場合はバックアップをご利用ください。</p></section>`;}
function render(){document.body.dataset.page=page;const titles={home:'ホーム',study:'今日の復習',calendar:'復習カレンダー',weak:'苦手な単語',random:'ランダム学習',library:'単語ライブラリ',settings:'データと設定'};$('#breadcrumb').textContent='kotonoha / '+titles[page];$('#today-label').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('#nav-count').textContent=due().length;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='weak'&&b.dataset.page==='library')));let html='';if(page==='home')html=home();else if(page==='calendar')html=calendar();else if(page==='study'||page==='random')html=study();else if(page==='settings')html=settings();else if(page==='weak')html=heading('ROOM TO GROW','苦手なことばに、もう一度。','誤答した単語を、誤答率の高い順に。ランダム学習の記録も含みます。')+`<section class="panel">${wordTable(state.words.filter(w=>w.wrong>0).sort((a,b)=>rate(b)-rate(a)||b.wrong-a.wrong))}</section>`;else html=heading('YOUR WORD COLLECTION','単語ライブラリ',`${state.words.length} 語のことばを、少しずつ自分のものに。`,importButton())+`<section class="panel"><div class="library-tools"><button class="secondary" data-page="weak">♧ 苦手な単語を見る</button></div><label for="search" class="sr-only">単語を検索</label><input id="search" type="search" placeholder="単語・意味を検索…" value="${esc(query)}"><div id="library-table">${wordTable(state.words.filter(w=>normalize(w.word+' '+w.meaning).includes(normalize(query))))}</div></section>`;$('#app').innerHTML=(storageError?'<div class="warning">保存データを読み込めませんでした。元のデータを保護するため編集を停止しています。バックアップの復元、またはブラウザー設定を確認してください。</div>':'')+html;bind();}
function navigate(p){page=p;session=null;render();window.scrollTo({top:0,behavior:'smooth'});}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function bind(){document.querySelectorAll('button[data-page], a[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.querySelectorAll('.import-trigger').forEach(b=>b.onclick=()=>{preview=[];$('#csv-file').value='';$('#import-preview').textContent='';$('#confirm-import').disabled=true;$('#import-dialog').showModal();});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.day;month=selectedDay.slice(0,7);page='calendar';render();});for(const [id,delta]of [['prev-month',-1],['next-month',1]])if($('#'+id))$('#'+id).onclick=()=>{const [y,m]=month.split('-').map(Number);month=dateKey(new Date(y,m-1+delta,1)).slice(0,7);render();};if($('#this-month'))$('#this-month').onclick=()=>{month=dateKey().slice(0,7);selectedDay=dateKey();render();};if($('#reveal'))$('#reveal').onclick=()=>{session.revealed=true;render();};document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{if(storageError){toast('保存データの読み込みエラーを解消してください。');return;}const correct=b.dataset.result==='correct',day=dateKey(),id=session.current;const next={...state,words:state.words.map(w=>w.id===id?answerWord(w,correct,day,session.mode):w),history:[...state.history,{day,wordId:id,correct,mode:session.mode}]};if(!save(next))return;session.count++;session.current=session.mode==='study'?session.queue.shift():weightedPick(state.words,id)?.id;session.revealed=false;render();});if($('#search'))$('#search').oninput=e=>{query=e.target.value;$('#library-table').innerHTML=wordTable(state.words.filter(w=>normalize(w.word+' '+w.meaning).includes(normalize(query))));};if($('#export-backup'))$('#export-backup').onclick=()=>download(`kotonoha-${dateKey()}.json`,JSON.stringify(state,null,2),'application/json');if($('#restore-backup'))$('#restore-backup').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>20*1024*1024)throw Error('20MB以下のファイルを選択してください。');const data=validateBackup(JSON.parse(await file.text()));if(confirm(`${data.words.length}語のバックアップで現在の単語と履歴を置き換えます。復元しますか？`)){if(save(data)){storageError=false;session=null;render();toast('バックアップを復元しました。');}}}catch(err){toast('復元できません：'+err.message);}e.target.value='';};}
$('#close-import').onclick=()=>$('#import-dialog').close();$('#download-sample').onclick=()=>download('kotonoha-sample.csv','\uFEFFword,meaning,example\r\nbloom,花開く|咲く,Flowers bloom in spring.\r\nnurture,育てる,Small habits nurture growth.\r\nremember,覚えている|思い出す,I remember this word.\r\ncurious,好奇心の強い,Stay curious.\r\ngentle,優しい|穏やかな,A gentle breeze moves the leaves.\r\n','text/csv;charset=utf-8');
let importToken=0;$('#csv-file').onchange=async e=>{const token=++importToken;preview=[];$('#confirm-import').disabled=true;const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('2MB以下のCSVを選択してください。');const parsed=parseCSV(await file.text());if(token!==importToken)return;const known=new Set(state.words.map(w=>normalize(w.word)));let duplicates=0;preview=parsed.filter(w=>{const k=normalize(w.word);if(known.has(k)){duplicates++;return false;}known.add(k);return true;});$('#import-preview').innerHTML=`<p><strong>${preview.length} 語を追加</strong> ・ 重複 ${duplicates} 語をスキップ</p><ul>${preview.slice(0,5).map(w=>`<li>${esc(w.word)} — ${esc(w.meaning)}</li>`).join('')}</ul>${preview.length>5?'<small>ほか '+(preview.length-5)+' 語</small>':''}`;$('#confirm-import').disabled=!preview.length||storageError;}catch(err){if(token===importToken)$('#import-preview').textContent=err.message;}};
$('#confirm-import').onclick=()=>{if(!preview.length||storageError)return;const added=preview.map((w,i)=>({...w,id:globalThis.crypto?.randomUUID?.()||`${Date.now()}-${i}-${Math.random()}`,started:null,pending:[],correct:0,wrong:0}));if(state.words.length+added.length>50000){toast('保存できる単語は50,000語までです。');return;}if(save({...state,words:[...state.words,...added]})){$('#import-dialog').close();toast(`${added.length} 語をインポートしました。`);session=null;render();}};
window.addEventListener('storage',e=>{if(e.key===KEY){try{state=e.newValue?validateBackup(JSON.parse(e.newValue)):{version:1,words:[],history:[]};storageError=false;session=null;render();toast('別のタブで更新された学習記録を反映しました。');}catch{storageError=true;render();}}});
let lastDay=dateKey();setInterval(()=>{if(dateKey()!==lastDay){lastDay=dateKey();session=null;render();}},30000);render();

})();




</script>
</body></html>
